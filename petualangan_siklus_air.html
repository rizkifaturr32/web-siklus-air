<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Siklus Air</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        sky: { 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9' },
                        ocean: { 400: '#2563eb', 500: '#1d4ed8' },
                        nature: { 400: '#4ade80', 500: '#22c55e' },
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0f9ff; }
        
        /* Animasi Simulasi */
        .sim-container { position: relative; overflow: hidden; background: linear-gradient(to bottom, #87CEEB 0%, #e0f2fe 100%); border-radius: 1rem; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); }
        .sim-sun { position: absolute; top: 10%; right: 10%; font-size: 4rem; filter: drop-shadow(0 0 15px #fbbf24); animation: pulse 3s infinite alternate; }
        .sim-sea { position: absolute; bottom: 0; right: 0; width: 60%; height: 30%; background: linear-gradient(to bottom, #3b82f6, #1d4ed8); border-radius: 100% 0 0 0 / 20% 0 0 0; }
        .sim-land { position: absolute; bottom: 0; left: 0; width: 50%; height: 45%; background: linear-gradient(to bottom, #22c55e, #166534); border-radius: 0 100% 0 0 / 0 100% 0 0; }
        .sim-tree { position: absolute; bottom: 35%; left: 20%; font-size: 3rem; }
        
        .sim-vapor { position: absolute; bottom: 30%; right: 25%; color: white; font-size: 1.5rem; opacity: 0; }
        .sim-transpiration { position: absolute; bottom: 45%; left: 25%; color: white; font-size: 1rem; opacity: 0; }
        .sim-cloud { position: absolute; top: 15%; right: 20%; font-size: 4rem; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); opacity: 0; }
        .sim-rain { position: absolute; top: 40%; left: 20%; color: #3b82f6; font-size: 1.5rem; opacity: 0; }
        .sim-groundwater { position: absolute; bottom: 15%; left: 20%; color: #60a5fa; font-size: 1.5rem; opacity: 0; }

        /* Keyframes */
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(-80px); opacity: 0; } }
        @keyframes cloudMove { 0% { right: 20%; opacity: 0; } 20% { opacity: 1; } 80% { right: 60%; opacity: 1; filter: brightness(0.8); } 100% { right: 60%; opacity: 0; } }
        @keyframes rainDrop { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(100px); opacity: 0; } }
        @keyframes flowRight { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(80px); opacity: 0; } }

        /* Animation Classes applied via JS */
        .running .anim-evaporate { animation: floatUp 3s infinite; }
        .running .anim-transpire { animation: floatUp 3s infinite 1.5s; }
        .running .anim-cloud { animation: cloudMove 8s infinite; }
        .running .anim-rain { animation: rainDrop 1.5s infinite 5s; }
        .running .anim-flow { animation: flowRight 3s infinite 6.5s; }

        .paused * { animation-play-state: paused !important; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- DATA MATERI ---
        const materiData = [
            { id: 1, title: "Evaporasi", icon: "☀️🌊", desc: "Evaporasi adalah proses penguapan. Panas matahari mengubah air di laut, sungai, dan danau menjadi uap air yang naik ke udara.", example: "Seperti baju basah yang dijemur di bawah sinar matahari, lama-kelamaan akan kering karena airnya menguap." },
            { id: 2, title: "Transpirasi", icon: "🌳💧", desc: "Selain dari air permukaan, tumbuhan juga melepaskan uap air ke udara melalui daunnya. Proses ini disebut transpirasi.", example: "Jika kamu membungkus daun tanaman dengan plastik di siang hari, akan muncul titik-titik air di dalam plastik tersebut." },
            { id: 3, title: "Kondensasi", icon: "☁️❄️", desc: "Uap air yang naik ke atas akan mendingin dan berubah menjadi titik-titik air kecil. Kumpulan titik air ini membentuk awan.", example: "Seperti embun di luar gelas yang berisi es dingin." },
            { id: 4, title: "Presipitasi", icon: "🌧️☔", desc: "Ketika awan sudah terlalu berat dan tidak bisa menahan titik-titik air, air akan jatuh ke Bumi sebagai hujan, salju, atau hujan es.", example: "Hujan yang sering kita lihat turun membasahi bumi." },
            { id: 5, title: "Infiltrasi", icon: "🌱💧", desc: "Sebagian air hujan yang jatuh ke tanah akan menyerap masuk ke dalam lapisan tanah menjadi air tanah.", example: "Saat kamu menyiram pot tanaman, airnya meresap menghilang ke dalam tanah." },
            { id: 6, title: "Aliran Permukaan", icon: "🏞️🌊", desc: "Air yang tidak meresap akan mengalir di atas permukaan tanah menuju parit, sungai, danau, dan akhirnya kembali ke laut. Siklus pun terulang kembali!", example: "Air yang mengalir di jalanan saat hujan deras menuju selokan." }
        ];

        // --- DATA KUIS ---
        const quizData = [
            { q: "Apa nama proses menguapnya air laut karena panas matahari?", options: ["Kondensasi", "Evaporasi", "Presipitasi", "Infiltrasi"], answer: 1, explanation: "Evaporasi adalah proses perubahan air cair menjadi uap air karena panas matahari." },
            { q: "Tumbuhan juga mengeluarkan uap air ke udara. Proses ini disebut...", options: ["Transpirasi", "Respirasi", "Fotosintesis", "Infiltrasi"], answer: 0, explanation: "Transpirasi adalah penguapan air dari makhluk hidup, terutama tumbuhan." },
            { q: "Awan terbentuk melalui proses yang disebut...", options: ["Evaporasi", "Presipitasi", "Kondensasi", "Aliran permukaan"], answer: 2, explanation: "Kondensasi adalah perubahan uap air yang hangat menjadi titik-titik air dingin yang membentuk awan." },
            { q: "Air yang jatuh dari awan ke permukaan Bumi disebut...", options: ["Evaporasi", "Infiltrasi", "Transpirasi", "Presipitasi"], answer: 3, explanation: "Presipitasi bisa berupa hujan, salju, atau hujan es." },
            { q: "Apa yang terjadi pada tahap infiltrasi?", options: ["Air meresap ke dalam tanah", "Air mengalir ke laut", "Air menguap ke udara", "Air berubah menjadi es"], answer: 0, explanation: "Infiltrasi adalah proses meresapnya air hujan ke dalam pori-pori tanah." },
            { q: "Apa sumber energi utama yang menggerakkan siklus air di Bumi?", options: ["Bulan", "Angin", "Matahari", "Inti Bumi"], answer: 2, explanation: "Panas Matahari membuat air menguap dan memulai seluruh siklus." },
            { q: "Berikut ini adalah bentuk presipitasi, KECUALI...", options: ["Hujan", "Salju", "Pelangi", "Hujan Es"], answer: 2, explanation: "Pelangi adalah pembiasan cahaya, bukan air yang jatuh ke bumi." },
            { q: "Mengapa air laut tidak pernah habis meskipun terus menguap?", options: ["Karena air sungai membawanya kembali", "Karena laut sangat dalam", "Karena dibantu oleh manusia", "Karena air laut asin"], answer: 0, explanation: "Melalui siklus air, hujan turun di daratan dan mengalir melalui sungai kembali ke laut." },
            { q: "Titik-titik embun di pagi hari pada daun merupakan contoh dari peristiwa...", options: ["Evaporasi", "Kondensasi", "Presipitasi", "Infiltrasi"], answer: 1, explanation: "Uap air di udara malam mendingin dan menempel pada daun menjadi embun (kondensasi)." },
            { q: "Apa yang akan terjadi jika tidak ada siklus air?", options: ["Bumi akan semakin dingin", "Bumi akan kekeringan", "Tumbuhan akan tumbuh subur", "Air laut akan meluap"], answer: 1, explanation: "Tanpa siklus air, daratan tidak akan mendapat pasokan air segar sehingga terjadi kekeringan." }
        ];

        // --- KOMPONEN UTAMA ---
        const App = () => {
            const [view, setView] = useState('home'); // home, learn, sim, game, video, quiz, summary, result
            const [progress, setProgress] = useState({
                learnedStages: [],
                quizScore: null,
                gameCompleted: false
            });

            // Load progress dari localStorage saat pertama kali dimuat
            useEffect(() => {
                const saved = localStorage.getItem('siklusAirProgress');
                if (saved) setProgress(JSON.parse(saved));
            }, []);

            // Simpan ke localStorage setiap kali progress berubah
            useEffect(() => {
                localStorage.setItem('siklusAirProgress', JSON.stringify(progress));
            }, [progress]);

            const markStageLearned = (id) => {
                if (!progress.learnedStages.includes(id)) {
                    setProgress(p => ({ ...p, learnedStages: [...p.learnedStages, id] }));
                }
            };

            const resetProgress = () => {
                setProgress({ learnedStages: [], quizScore: null, gameCompleted: false });
                localStorage.removeItem('siklusAirProgress');
                setView('home');
            };

            return (
                <div className="min-h-screen pb-20 md:pb-0">
                    {/* Navigasi Atas */}
                    <nav className="bg-sky-500 text-white p-4 shadow-md sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <div className="font-bold text-xl flex items-center cursor-pointer" onClick={() => setView('home')}>
                                <i className="fa-solid fa-cloud-showers-water mr-2"></i> Siklus Air
                            </div>
                            <div className="hidden md:flex space-x-4 text-sm font-semibold items-center">
                                <button onClick={() => setView('home')} className={`hover:text-sky-200 transition-colors ${view==='home'?'underline font-extrabold':''}`}>Beranda</button>
                                <button onClick={() => setView('learn')} className={`hover:text-sky-200 transition-colors ${view==='learn'?'underline font-extrabold':''}`}>Materi</button>
                                <button onClick={() => setView('sim')} className={`hover:text-sky-200 transition-colors ${view==='sim'?'underline font-extrabold':''}`}>Simulasi</button>
                                <button onClick={() => setView('game')} className={`hover:text-sky-200 transition-colors ${view==='game'?'underline font-extrabold':''}`}>Game</button>
                                {/* Tombol Video YouTube di sebelah kanan Tombol Game */}
                                <button onClick={() => setView('video')} className={`hover:text-sky-200 transition-colors flex items-center gap-1 bg-red-600 hover:bg-red-700 px-3 py-1 rounded-full text-white shadow-sm ${view==='video'?'ring-2 ring-white font-extrabold':''}`}>
                                    <i className="fa-brands fa-youtube"></i> Video
                                </button>
                                <button onClick={() => setView('quiz')} className={`hover:text-sky-200 transition-colors ${view==='quiz'?'underline font-extrabold':''}`}>Kuis</button>
                                <button onClick={() => setView('result')} className={`hover:text-sky-200 transition-colors ${view==='result'?'underline font-extrabold':''}`}>Hasil</button>
                            </div>
                            {/* Mobile Menu Icon */}
                            <div className="md:hidden text-2xl">
                                ☁️
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-4 mt-4">
                        {view === 'home' && <Home setView={setView} progress={progress} />}
                        {view === 'learn' && <Learn setView={setView} markStageLearned={markStageLearned} progress={progress}/>}
                        {view === 'sim' && <Simulation />}
                        {view === 'game' && <Game setView={setView} setProgress={setProgress} />}
                        {view === 'video' && <VideoEdu setView={setView} />}
                        {view === 'quiz' && <Quiz setView={setView} setProgress={setProgress} />}
                        {view === 'summary' && <Summary setView={setView} />}
                        {view === 'result' && <Result progress={progress} resetProgress={resetProgress} setView={setView} />}
                    </main>

                    {/* Navigasi Bawah (Mobile) */}
                    <div className="md:hidden fixed bottom-0 w-full bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.1)] flex justify-around p-3 text-xs text-gray-600 z-50">
                        <button onClick={() => setView('home')} className={`flex flex-col items-center ${view==='home'?'text-sky-500 font-bold':''}`}><i className="fa-solid fa-house mb-1 text-lg"></i>Home</button>
                        <button onClick={() => setView('learn')} className={`flex flex-col items-center ${view==='learn'?'text-sky-500 font-bold':''}`}><i className="fa-solid fa-book mb-1 text-lg"></i>Materi</button>
                        <button onClick={() => setView('sim')} className={`flex flex-col items-center ${view==='sim'?'text-sky-500 font-bold':''}`}><i className="fa-solid fa-play mb-1 text-lg"></i>Simulasi</button>
                        <button onClick={() => setView('game')} className={`flex flex-col items-center ${view==='game'?'text-sky-500 font-bold':''}`}><i className="fa-solid fa-puzzle-piece mb-1 text-lg"></i>Game</button>
                        {/* Tombol Video Mobile di sebelah kanan Game */}
                        <button onClick={() => setView('video')} className={`flex flex-col items-center ${view==='video'?'text-red-600 font-bold':''}`}><i className="fa-brands fa-youtube mb-1 text-lg text-red-500"></i>Video</button>
                        <button onClick={() => setView('result')} className={`flex flex-col items-center ${view==='result'?'text-sky-500 font-bold':''}`}><i className="fa-solid fa-trophy mb-1 text-lg"></i>Hasil</button>
                    </div>
                </div>
            );
        };

        // --- KOMPONEN BERANDA ---
        const Home = ({ setView, progress }) => {
            const progressPercent = Math.round(((progress.learnedStages.length / 6) * 50) + (progress.gameCompleted ? 25 : 0) + (progress.quizScore !== null ? 25 : 0));

            return (
                <div className="text-center animate-fade-in">
                    <div className="bg-white rounded-3xl p-8 shadow-lg border-4 border-sky-100 mb-8 relative overflow-hidden">
                        <div className="absolute top-0 left-0 text-6xl opacity-20 -translate-x-1/2 -translate-y-1/2">☁️</div>
                        <div className="absolute bottom-0 right-0 text-6xl opacity-20 translate-x-1/4 translate-y-1/4">🌊</div>
                        
                        <h1 className="text-4xl md:text-5xl font-extrabold text-sky-600 mb-4">Petualangan Siklus Air</h1>
                        <p className="text-lg md:text-xl text-gray-600 mb-8 font-medium">Ayo jelajahi perjalanan luar biasa air di Bumi kita!</p>
                        
                        <div className="flex justify-center mb-8 text-8xl space-x-4">
                            ☀️ ☁️ 🌧️ 🌊
                        </div>
                        
                        <div className="flex flex-col sm:flex-row justify-center gap-4">
                            <button 
                                onClick={() => setView('learn')}
                                className="bg-sky-500 hover:bg-sky-600 text-white text-xl font-bold py-4 px-8 rounded-full shadow-[0_5px_0_#0284c7] active:shadow-[0_0px_0_#0284c7] active:translate-y-[5px] transition-all"
                            >
                                Mulai Belajar! <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>

                    <div className="glass-panel p-6">
                        <h3 className="text-xl font-bold text-gray-700 mb-4">Progres Belajarmu</h3>
                        <div className="w-full bg-gray-200 rounded-full h-6 mb-2 border border-gray-300">
                            <div className="bg-nature-400 h-6 rounded-full transition-all duration-1000 flex items-center justify-center text-xs font-bold text-white" style={{ width: `${progressPercent}%` }}>
                                {progressPercent > 10 ? `${progressPercent}%` : ''}
                            </div>
                        </div>
                        <p className="text-sm text-gray-500">Selesaikan materi, tonton video, mainkan game, dan jawab kuis untuk mencapai 100%!</p>
                    </div>
                </div>
            );
        };

        // --- KOMPONEN MATERI ---
        const Learn = ({ setView, markStageLearned, progress }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            
            useEffect(() => {
                markStageLearned(materiData[currentIndex].id);
            }, [currentIndex]);

            const handleNext = () => {
                if (currentIndex < materiData.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                } else {
                    setView('sim');
                }
            };

            const handlePrev = () => {
                if (currentIndex > 0) setCurrentIndex(currentIndex - 1);
            };

            const data = materiData[currentIndex];

            return (
                <div className="animate-fade-in max-w-2xl mx-auto">
                    <div className="flex justify-between items-center mb-4">
                        <span className="text-sm font-bold text-sky-500">Tahap {currentIndex + 1} dari 6</span>
                        <div className="flex space-x-1">
                            {materiData.map((m, i) => (
                                <div key={m.id} className={`w-3 h-3 rounded-full ${i === currentIndex ? 'bg-sky-500' : progress.learnedStages.includes(m.id) ? 'bg-sky-300' : 'bg-gray-300'}`}></div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl p-6 md:p-10 shadow-lg border-2 border-sky-100 text-center">
                        <div className="text-8xl mb-6">{data.icon}</div>
                        <h2 className="text-3xl font-extrabold text-gray-800 mb-4">{data.title}</h2>
                        <p className="text-lg text-gray-600 mb-6 leading-relaxed bg-blue-50 p-4 rounded-xl border border-blue-100">{data.desc}</p>
                        
                        <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg text-left">
                            <h4 className="font-bold text-yellow-700 mb-1"><i className="fa-solid fa-lightbulb mr-1"></i> Contoh Sehari-hari:</h4>
                            <p className="text-sm text-yellow-800">{data.example}</p>
                        </div>
                    </div>

                    <div className="flex justify-between mt-6">
                        <button 
                            onClick={handlePrev}
                            disabled={currentIndex === 0}
                            className={`px-6 py-3 rounded-xl font-bold transition-all ${currentIndex === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white text-sky-500 shadow-md hover:bg-sky-50'}`}
                        >
                            <i className="fa-solid fa-arrow-left mr-2"></i> Sebelumnya
                        </button>
                        
                        <button 
                            onClick={handleNext}
                            className="px-6 py-3 rounded-xl font-bold bg-sky-500 text-white shadow-[0_4px_0_#0284c7] active:translate-y-[4px] active:shadow-none transition-all"
                        >
                            {currentIndex === materiData.length - 1 ? 'Ke Simulasi' : 'Selanjutnya'} <i className="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            );
        };

        // --- KOMPONEN SIMULASI ---
        const Simulation = () => {
            const [status, setStatus] = useState('running'); // 'running' | 'paused'
            
            const toggleSim = () => setStatus(status === 'running' ? 'paused' : 'running');
            const resetSim = () => {
                setStatus('paused');
                setTimeout(() => setStatus('running'), 100);
            };

            return (
                <div className="animate-fade-in">
                    <h2 className="text-3xl font-extrabold text-center text-sky-600 mb-2">Simulasi Siklus Air</h2>
                    <p className="text-center text-gray-600 mb-6 font-medium">Perhatikan bagaimana air bergerak di alam!</p>

                    {/* Canvas Simulasi CSS */}
                    <div className={`sim-container w-full h-[400px] mb-6 border-4 border-white ${status}`}>
                        <div className="sim-sun">☀️</div>
                        <div className="sim-sea"></div>
                        <div className="sim-land"></div>
                        <div className="sim-tree">🌳</div>
                        
                        {/* Partikel Animasi */}
                        <div className="sim-vapor anim-evaporate" style={{right: '25%'}}>〰️<br/>〰️</div>
                        <div className="sim-vapor anim-evaporate" style={{right: '15%', animationDelay: '0.5s'}}>〰️</div>
                        <div className="sim-transpiration anim-transpire">〰️</div>
                        
                        <div className="sim-cloud anim-cloud">☁️</div>
                        
                        <div className="sim-rain anim-rain">💧</div>
                        <div className="sim-rain anim-rain" style={{left: '25%', animationDelay: '5.2s'}}>💧</div>
                        <div className="sim-rain anim-rain" style={{left: '30%', animationDelay: '5.4s'}}>💧</div>

                        <div className="sim-groundwater anim-flow">➡️</div>
                        <div className="sim-groundwater anim-flow" style={{bottom: '5%', animationDelay: '6.8s'}}>➡️</div>
                        
                        {/* Label Overlay */}
                        <div className="absolute bottom-5 right-5 text-white font-bold bg-blue-800 bg-opacity-50 px-2 py-1 rounded text-sm">Laut</div>
                        <div className="absolute bottom-5 left-5 text-white font-bold bg-green-800 bg-opacity-50 px-2 py-1 rounded text-sm">Daratan</div>
                    </div>

                    {/* Kontrol Simulasi */}
                    <div className="bg-white p-4 rounded-2xl shadow-md flex justify-center space-x-4 mb-6">
                        <button onClick={toggleSim} className={`w-14 h-14 rounded-full flex items-center justify-center text-xl text-white shadow-lg transition-transform hover:scale-105 ${status === 'running' ? 'bg-amber-500' : 'bg-green-500'}`}>
                            <i className={`fa-solid ${status === 'running' ? 'fa-pause' : 'fa-play'}`}></i>
                        </button>
                        <button onClick={resetSim} className="w-14 h-14 rounded-full bg-gray-500 text-white flex items-center justify-center text-xl shadow-lg transition-transform hover:scale-105">
                            <i className="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                    
                    {/* Penjelasan Singkat */}
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                        {materiData.map(m => (
                            <div key={m.id} className="bg-white p-3 rounded-xl shadow-sm text-center border border-gray-100">
                                <span className="text-2xl block mb-1">{m.icon}</span>
                                <span className="text-xs font-bold text-gray-700">{m.title}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- KOMPONEN VIDEO EDUKASI YOUTUBE ---
        const VideoEdu = ({ setView }) => {
            return (
                <div className="animate-fade-in max-w-3xl mx-auto">
                    <div className="text-center mb-6">
                        <span className="bg-red-100 text-red-600 font-bold px-3 py-1 rounded-full text-sm inline-block mb-2">
                            <i className="fa-brands fa-youtube mr-1"></i> Media Pembelajaran
                        </span>
                        <h2 className="text-3xl font-extrabold text-gray-800">Video Siklus Air</h2>
                        <p className="text-gray-600 text-sm mt-1">Saksikan penjelasan visual interaktif mengenai proses terjadinya siklus air di Bumi!</p>
                    </div>

                    {/* Pembungkus Video Youtube Responsive 16:9 */}
                    <div className="relative w-full aspect-video rounded-3xl overflow-hidden shadow-2xl border-4 border-white mb-6 bg-black">
                        <iframe
                            className="absolute top-0 left-0 w-full h-full"
                            src="https://www.youtube.com/embed/DWt6i6zlPu0"
                            title="Video Pembelajaran Siklus Air"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowFullScreen
                        ></iframe>
                    </div>

                    <div className="bg-white rounded-2xl p-6 shadow-md border border-gray-100 mb-6">
                        <h3 className="font-bold text-lg text-gray-800 mb-2 flex items-center">
                            <i className="fa-solid fa-circle-info text-sky-500 mr-2"></i> Poin Penting Video:
                        </h3>
                        <ul className="list-disc list-inside text-gray-600 space-y-2 text-sm">
                            <li>Proses penguapan air dari samudra, laut, dan danau akibat sinar matahari (Evaporasi).</li>
                            <li>Pembentukan awan ketika uap air naik dan mendingin di atmosfer (Kondensasi).</li>
                            <li>Turunnya titik-titik air kembali ke permukaan bumi sebagai hujan (Presipitasi).</li>
                            <li>Penyerapannya ke dalam lapisan tanah untuk menjadi cadangan air tanah (Infiltrasi).</li>
                        </ul>
                    </div>

                    <div className="flex justify-between items-center">
                        <button 
                            onClick={() => setView('game')} 
                            className="bg-white text-gray-700 px-6 py-3 rounded-xl font-bold shadow-md hover:bg-gray-50 flex items-center"
                        >
                            <i className="fa-solid fa-arrow-left mr-2"></i> Ke Game
                        </button>
                        <button 
                            onClick={() => setView('quiz')} 
                            className="bg-sky-500 text-white px-6 py-3 rounded-xl font-bold shadow-[0_4px_0_#0284c7] active:translate-y-[4px] active:shadow-none transition-all flex items-center"
                        >
                            Lanjut ke Kuis <i className="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            );
        };

        // --- KOMPONEN KUIS ---
        const Quiz = ({ setView, setProgress }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [showFeedback, setShowFeedback] = useState(false);
            const [isCorrect, setIsCorrect] = useState(false);
            const [selectedOpt, setSelectedOpt] = useState(null);
            const [finished, setFinished] = useState(false);
            const [questions, setQuestions] = useState([]);

            // Acak soal saat komponen dimount
            useEffect(() => {
                const shuffled = [...quizData].sort(() => 0.5 - Math.random());
                setQuestions(shuffled);
            }, []);

            const handleAnswer = (index) => {
                if (showFeedback) return;
                setSelectedOpt(index);
                const correct = index === questions[currentQ].answer;
                setIsCorrect(correct);
                if (correct) setScore(score + 1);
                setShowFeedback(true);
            };

            const nextQuestion = () => {
                setShowFeedback(false);
                setSelectedOpt(null);
                if (currentQ < questions.length - 1) {
                    setCurrentQ(currentQ + 1);
                } else {
                    setFinished(true);
                    setProgress(p => ({ ...p, quizScore: Math.round(((score + (isCorrect?1:0)) / questions.length) * 100) }));
                }
            };

            if (questions.length === 0) return <div>Memuat...</div>;

            if (finished) {
                const finalScore = Math.round((score / questions.length) * 100);
                return (
                    <div className="text-center animate-fade-in max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl border-t-8 border-sky-500">
                        <div className="text-6xl mb-4">{finalScore >= 80 ? '🏆' : finalScore >= 50 ? '👍' : '📚'}</div>
                        <h2 className="text-3xl font-extrabold text-gray-800 mb-2">Kuis Selesai!</h2>
                        <p className="text-gray-600 mb-6">Kamu menjawab benar {score} dari {questions.length} soal.</p>
                        
                        <div className="text-5xl font-black text-sky-500 mb-8">{finalScore} %</div>
                        
                        <div className="space-y-3">
                            <button onClick={() => { setCurrentQ(0); setScore(0); setFinished(false); }} className="w-full bg-sky-500 text-white font-bold py-3 rounded-xl shadow-md hover:bg-sky-600">Coba Lagi</button>
                            <button onClick={() => setView('result')} className="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-xl shadow-md hover:bg-gray-300">Lihat Hasil Akhir</button>
                        </div>
                    </div>
                );
            }

            const q = questions[currentQ];

            return (
                <div className="max-w-2xl mx-auto animate-fade-in">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-700">Kuis Pengetahuan</h2>
                        <span className="bg-sky-100 text-sky-800 font-bold py-1 px-3 rounded-full text-sm">Soal {currentQ + 1}/10</span>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-md mb-6">
                        <h3 className="text-xl font-bold text-gray-800 mb-6 leading-snug">{q.q}</h3>
                        <div className="space-y-3">
                            {q.options.map((opt, i) => {
                                let btnClass = "w-full text-left p-4 rounded-xl border-2 font-semibold transition-all ";
                                if (!showFeedback) {
                                    btnClass += "border-gray-200 hover:border-sky-500 hover:bg-sky-50";
                                } else {
                                    if (i === q.answer) btnClass += "border-green-500 bg-green-50 text-green-700";
                                    else if (i === selectedOpt) btnClass += "border-red-500 bg-red-50 text-red-700";
                                    else btnClass += "border-gray-200 opacity-50";
                                }

                                return (
                                    <button key={i} onClick={() => handleAnswer(i)} disabled={showFeedback} className={btnClass}>
                                        <span className="inline-block w-8 h-8 text-center leading-8 bg-white border border-gray-300 rounded-full mr-3">{['A','B','C','D'][i]}</span>
                                        {opt}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {showFeedback && (
                        <div className={`p-5 rounded-2xl mb-6 animate-fade-in ${isCorrect ? 'bg-green-100 border-l-4 border-green-500' : 'bg-red-100 border-l-4 border-red-500'}`}>
                            <h4 className={`font-bold text-lg mb-1 ${isCorrect ? 'text-green-700' : 'text-red-700'}`}>
                                {isCorrect ? '✔️ Benar Sekali! Hebat!' : '❌ Ops, Kurang Tepat!'}
                            </h4>
                            <p className="text-gray-700 mb-4">{q.explanation}</p>
                            <button onClick={nextQuestion} className="bg-gray-800 text-white px-6 py-2 rounded-lg font-bold shadow-md hover:bg-gray-900">
                                {currentQ < questions.length - 1 ? 'Soal Berikutnya' : 'Lihat Nilai'}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // --- KOMPONEN GAME (Mengurutkan) ---
        const Game = ({ setView, setProgress }) => {
            const correctOrder = [1, 2, 3, 4, 5, 6];
            const [items, setItems] = useState([]);
            const [isChecking, setIsChecking] = useState(false);
            const [success, setSuccess] = useState(false);

            useEffect(() => {
                // Acak urutan awal
                const shuffled = [...materiData].sort(() => 0.5 - Math.random());
                setItems(shuffled);
            }, []);

            const moveUp = (index) => {
                if (index === 0) return;
                const newItems = [...items];
                [newItems[index-1], newItems[index]] = [newItems[index], newItems[index-1]];
                setItems(newItems);
            };

            const moveDown = (index) => {
                if (index === items.length - 1) return;
                const newItems = [...items];
                [newItems[index+1], newItems[index]] = [newItems[index], newItems[index+1]];
                setItems(newItems);
            };

            const checkAnswer = () => {
                setIsChecking(true);
                const currentOrder = items.map(i => i.id);
                const isWin = currentOrder.every((val, index) => val === correctOrder[index]);
                if (isWin) {
                    setSuccess(true);
                    setProgress(p => ({ ...p, gameCompleted: true }));
                } else {
                    setTimeout(() => setIsChecking(false), 2000);
                }
            };

            if (success) {
                return (
                    <div className="text-center bg-white p-8 rounded-3xl shadow-xl animate-fade-in max-w-md mx-auto">
                        <div className="text-6xl mb-4">🌟</div>
                        <h2 className="text-3xl font-bold text-green-500 mb-2">Luar Biasa!</h2>
                        <p className="text-gray-600 mb-6">Kamu berhasil menyusun siklus air dengan urutan yang benar.</p>
                        <div className="flex flex-col gap-3">
                            <button onClick={() => setView('result')} className="bg-sky-500 text-white font-bold py-3 px-8 rounded-xl shadow-[0_4px_0_#0284c7] active:translate-y-[4px] active:shadow-none">Lihat Hasil Belajar</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto animate-fade-in">
                    <div className="text-center mb-6">
                        <h2 className="text-2xl font-bold text-sky-600">Game Susun Urutan</h2>
                        <p className="text-gray-600 text-sm">Gunakan tombol panah untuk menyusun tahapan siklus air dari awal hingga akhir!</p>
                    </div>

                    <div className="space-y-3 mb-6">
                        {items.map((item, index) => {
                            let statusClass = "bg-white border-gray-200";
                            if (isChecking) {
                                statusClass = item.id === correctOrder[index] ? "bg-green-100 border-green-500" : "bg-red-100 border-red-500";
                            }

                            return (
                                <div key={item.id} className={`flex items-center p-3 rounded-xl border-2 shadow-sm transition-colors ${statusClass}`}>
                                    <div className="flex flex-col mr-3 space-y-1">
                                        <button onClick={() => moveUp(index)} disabled={index===0 || isChecking} className="text-gray-400 hover:text-sky-500 disabled:opacity-30"><i className="fa-solid fa-chevron-up"></i></button>
                                        <button onClick={() => moveDown(index)} disabled={index===items.length-1 || isChecking} className="text-gray-400 hover:text-sky-500 disabled:opacity-30"><i className="fa-solid fa-chevron-down"></i></button>
                                    </div>
                                    <div className="text-3xl mr-4">{item.icon}</div>
                                    <div className="font-bold text-gray-700 flex-1">{item.title}</div>
                                    {isChecking && <div className="text-xl">{item.id === correctOrder[index] ? '✅' : '❌'}</div>}
                                </div>
                            );
                        })}
                    </div>

                    <button 
                        onClick={checkAnswer} 
                        disabled={isChecking}
                        className={`w-full font-bold py-4 rounded-xl shadow-[0_5px_0_rgba(0,0,0,0.2)] active:translate-y-[5px] active:shadow-none transition-all text-white ${isChecking ? 'bg-gray-400' : 'bg-nature-500 hover:bg-nature-600'}`}
                    >
                        {isChecking ? 'Mengecek...' : 'Cek Jawaban'}
                    </button>
                </div>
            );
        };

        // --- KOMPONEN RINGKASAN ---
        const Summary = ({ setView }) => (
            <div className="animate-fade-in">
                <h2 className="text-3xl font-extrabold text-center text-sky-600 mb-6">Ringkasan Materi</h2>
                
                <div className="bg-white p-6 rounded-2xl shadow-md mb-6 border-l-8 border-sky-400">
                    <h3 className="font-bold text-xl mb-3 flex items-center"><i className="fa-solid fa-list-ol mr-2 text-sky-500"></i> Urutan Proses</h3>
                    <ul className="space-y-2 text-gray-700">
                        <li><strong>1. Evaporasi:</strong> Air menguap karena panas (☀️➡️☁️).</li>
                        <li><strong>2. Transpirasi:</strong> Tumbuhan mengeluarkan uap air (🌳➡️☁️).</li>
                        <li><strong>3. Kondensasi:</strong> Uap air mendingin jadi awan (☁️).</li>
                        <li><strong>4. Presipitasi:</strong> Air jatuh sebagai hujan/salju (🌧️).</li>
                        <li><strong>5. Infiltrasi:</strong> Air meresap ke tanah (🌱).</li>
                        <li><strong>6. Aliran Permukaan:</strong> Air mengalir kembali ke laut (🌊).</li>
                    </ul>
                </div>

                <div className="bg-yellow-50 p-6 rounded-2xl shadow-md mb-6 border border-yellow-200">
                    <h3 className="font-bold text-xl mb-3 text-yellow-700 flex items-center"><i className="fa-solid fa-lightbulb mr-2"></i> Fakta Menarik!</h3>
                    <p className="text-gray-700 italic">"Jumlah air di Bumi selalu tetap, hanya berubah bentuk dan tempatnya saja. Air yang kamu minum hari ini mungkin saja pernah diminum oleh dinosaurus jutaan tahun yang lalu!"</p>
                </div>

                <div className="text-center">
                    <button onClick={() => setView('result')} className="bg-sky-500 text-white px-8 py-3 rounded-full font-bold shadow-md hover:bg-sky-600">Lihat Hasil Belajarmu</button>
                </div>
            </div>
        );

        // --- KOMPONEN HASIL BELAJAR ---
        const Result = ({ progress, resetProgress, setView }) => {
            const mtrCount = progress.learnedStages.length;
            const quizScore = progress.quizScore !== null ? progress.quizScore : 0;
            const gameOk = progress.gameCompleted;
            
            // Kalkulasi pemahaman (Materi 30%, Game 30%, Kuis 40%)
            const totalPercent = Math.round(((mtrCount/6)*30) + (gameOk ? 30 : 0) + ((quizScore/100)*40));

            let message = "";
            let color = "text-sky-500";
            if (totalPercent < 50) { message = "Tetap Semangat! Ayo ulangi materinya."; color="text-red-500"; }
            else if (totalPercent < 80) { message = "Bagus! Sedikit lagi kamu jadi ahli siklus air."; color="text-yellow-500"; }
            else { message = "Luar Biasa! Kamu adalah Penjelajah Air Sejati!"; color="text-green-500"; }

            return (
                <div className="max-w-2xl mx-auto animate-fade-in">
                    <div className="bg-white rounded-3xl p-8 shadow-xl border-t-8 border-sky-400 text-center relative overflow-hidden">
                        <h2 className="text-3xl font-extrabold text-gray-800 mb-2">Rapor Belajarmu</h2>
                        <p className={`text-lg font-bold mb-6 ${color}`}>{message}</p>
                        
                        <div className="flex justify-center items-center mb-8">
                            <div className="relative w-40 h-40">
                                <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                    <path className="text-gray-200" strokeWidth="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path className="text-sky-500 transition-all duration-1000" strokeDasharray={`${totalPercent}, 100`} strokeWidth="3" strokeLinecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div className="absolute inset-0 flex items-center justify-center flex-col">
                                    <span className="text-4xl font-black text-gray-700">{totalPercent}%</span>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 text-left">
                            <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 flex flex-col items-center text-center cursor-pointer hover:bg-blue-100" onClick={()=>setView('learn')}>
                                <span className="text-3xl mb-2">📚</span>
                                <span className="text-sm text-gray-500">Materi Dibaca</span>
                                <span className="font-bold text-lg text-blue-700">{mtrCount} / 6</span>
                            </div>
                            <div className="bg-green-50 p-4 rounded-xl border border-green-100 flex flex-col items-center text-center cursor-pointer hover:bg-green-100" onClick={()=>setView('game')}>
                                <span className="text-3xl mb-2">🧩</span>
                                <span className="text-sm text-gray-500">Game Susun</span>
                                <span className="font-bold text-lg text-green-700">{gameOk ? 'Selesai ✅' : 'Belum ❌'}</span>
                            </div>
                            <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-100 flex flex-col items-center text-center cursor-pointer hover:bg-yellow-100" onClick={()=>setView('quiz')}>
                                <span className="text-3xl mb-2">📝</span>
                                <span className="text-sm text-gray-500">Nilai Kuis</span>
                                <span className="font-bold text-lg text-yellow-700">{progress.quizScore !== null ? `${progress.quizScore}` : 'Belum'}</span>
                            </div>
                        </div>

                        <div className="flex flex-col sm:flex-row gap-4 justify-center">
                            <button onClick={() => setView('summary')} className="px-6 py-3 rounded-xl font-bold bg-sky-100 text-sky-700 hover:bg-sky-200">Lihat Ringkasan</button>
                            <button onClick={resetProgress} className="px-6 py-3 rounded-xl font-bold bg-red-100 text-red-600 hover:bg-red-200"><i className="fa-solid fa-trash mr-2"></i>Hapus Data & Ulang</button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
